{% extends 'core/base.html' %}{% block content %}<div class="page-title"><div><h1>{% if player %}Edit Player{% else %}Add Player{% endif %}</h1><p>Enter player details and performance statistics.</p></div><a class="btn" href="{% url 'players' %}">← Back to players</a></div><form class="panel form-panel" method="post">{% csrf_token %}<h3>Player details</h3><div class="form-grid"><label>Player name *<input required name="name" value="{{player.name|default:''}}"></label><label>Age<input type="number" min="1" max="80" name="age" value="{{player.age|default:20}}"></label><label>Jersey number<input type="number" name="jersey_number" value="{{player.jersey_number|default:0}}"></label><label>Team<select name="team"><option value="">Unassigned</option>{% for t in teams %}<option value="{{t.pk}}" {% if player.team_id == t.pk %}selected{% endif %}>{{t.name}}</option>{% endfor %}</select></label><label>Role<select name="role"><option {% if player.role == 'Batter' or not player %}selected{% endif %}>Batter</option><option {% if player.role == 'Bowler' %}selected{% endif %}>Bowler</option><option {% if player.role == 'All-rounder' %}selected{% endif %}>All-rounder</option><option {% if player.role == 'Wicketkeeper' %}selected{% endif %}>Wicketkeeper</option></select></label><label>Batting style<input name="batting_style" value="{{player.batting_style|default:''}}" placeholder="Right-hand"></label><label>Bowling style<input name="bowling_style" value="{{player.bowling_style|default:''}}" placeholder="Right-arm fast"></label></div><h3>Statistics</h3><div class="form-grid"><label>Matches<input type="number" min="0" name="matches" value="{{player.matches|default:0}}"></label><label>Runs<input type="number" min="0" name="runs" value="{{player.runs|default:0}}"></label><label>Batting average<input type="number" step="0.1" min="0" name="batting_average" value="{{player.batting_average|default:0}}"></label><label>Strike rate<input type="number" step="0.1" min="0" name="strike_rate" value="{{player.strike_rate|default:0}}"></label><label>Wickets<input type="number" min="0" name="wickets" value="{{player.wickets|default:0}}"></label><label>Economy rate<input type="number" step="0.1" min="0" name="economy" value="{{player.economy|default:0}}"></label><label>Fitness (0–100)<input type="number" min="0" max="100" name="fitness" value="{{player.fitness|default:75}}"></label><label>Recent form (0–100)<input type="number" min="0" max="100" name="recent_form" value="{{player.recent_form|default:75}}"></label><label>Catches<input type="number" min="0" name="catches" value="{{player.catches|default:0}}"></label></div><button class="btn primary" type="submit">Save player</button></form>{% endblock %}
